<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假單送審追蹤</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

  :root{
    --bg: #FBF2E1;
    --paper: #FFFFFF;
    --paper-line: #ECDBB4;
    --ink: #2E2515;
    --ink-soft: #8A7452;
    --stamp-red: #B5462B;
    --stamp-red-bg: #FBEAE1;
    --stamp-green: #6E7A34;
    --stamp-green-bg: #F1EFDC;
    --accent: #C4791A;
    --accent-hover: #A6630F;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; background:transparent; }
  body{
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--ink);
    padding: 20px 16px 60px;
    max-width: 720px;
    margin: 0 auto;
  }

  header{
    padding-bottom: 18px;
    margin-bottom: 18px;
    border-bottom: 2px solid var(--ink);
  }
  header h1{
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  header p{
    margin: 0;
    color: var(--ink-soft);
    font-size: 13.5px;
    line-height: 1.6;
  }

  .panel{
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2{
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 10px;
    color: var(--ink);
  }

  textarea{
    width: 100%;
    min-height: 110px;
    resize: vertical;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: #FFFBF3;
  }
  textarea:focus{ outline: 2px solid var(--accent); outline-offset: 1px; }

  .btn-row{
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
  .upload-row{
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .file-label{
    display: inline-block;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 7px;
    padding: 9px 16px;
    border: 1px solid var(--paper-line);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .file-label:hover{ background: #F5EAD3; }
  .file-name{
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .divider-text{
    font-size: 12px;
    color: var(--ink-soft);
    margin: 2px 0 10px;
  }
  input[type="text"], input[type="password"]{
    font-family: 'Noto Sans TC', sans-serif;
  }
  button{
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13.5px;
    font-weight: 700;
    border-radius: 7px;
    padding: 9px 16px;
    border: 1px solid transparent;
    cursor: pointer;
  }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary{ background: var(--accent); color: #fff; }
  .btn-primary:hover{ background: var(--accent-hover); }
  .btn-primary:disabled{ opacity: 0.6; cursor: default; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border-color: var(--paper-line); }
  .btn-ghost:hover{ background: #F5EAD3; }
  .parse-msg{ font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; min-height: 16px; }

  .stats{
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat{
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 12px 14px;
    text-align: left;
  }
  .stat .num{ font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; }
  .stat .lbl{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .stat.pending .num{ color: var(--stamp-red); }
  .stat.done .num{ color: var(--stamp-green); }

  .list-head{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .filter-toggle{
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
  }
  .filter-toggle input{ width: 15px; height: 15px; }

  .two-col-wrap{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 700px){
    .two-col-wrap{
      grid-template-columns: 1fr;
    }
  }
  .col-section{ min-width: 0; }
  .col-title{
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 8px;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
    background: #F6E2C4;
    border: 1px solid #C99A4A;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .col-count{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--ink-soft);
    background: #F5EAD3;
    padding: 1px 7px;
    border-radius: 10px;
  }

  .month-multiselect{
    position: relative;
  }
  .month-dropdown{
    display: none;
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    z-index: 20;
    width: 200px;
  }
  .month-dropdown.open{ display: block; }
  .month-dropdown-grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .month-dropdown-grid label{
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
  }
  .month-dropdown-grid input{ width: 14px; height: 14px; }
  .month-dropdown-actions{
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--paper-line);
    padding-top: 8px;
  }
  .month-dropdown-actions button{
    flex: 1;
    padding: 5px 6px;
    font-size: 12px;
  }

  .view-tabs{
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--paper-line);
  }
  .tab-btn{
    background: none;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 8px 4px 10px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab-btn.active{
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .stats-table-wrap{
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .stats-table-title{
    background: var(--accent);
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    padding: 8px;
  }
  .stats-table{
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .stats-table th, .stats-table td{
    padding: 6px 8px;
    text-align: center;
    border: 1px solid var(--paper-line);
    white-space: nowrap;
    vertical-align: top;
  }
  .stats-table thead th{
    background: #F5EAD3;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .stats-table td:first-child, .stats-table th:first-child{
    text-align: center;
    vertical-align: middle;
    position: sticky;
    left: 0;
    background: var(--paper);
    width: 1%;
    min-width: 100px;
  }
  .stats-table thead th:first-child{ background: #F5EAD3; }
  .stats-table tbody tr:nth-child(even) td{ background: #FFFBF3; }
  .stats-table tbody tr:nth-child(even) td:first-child{ background: #FFFBF3; }
  .stats-table th:nth-child(2){
    text-align: center;
  }
  .stats-table td:nth-child(2){
    text-align: left;
    padding-left: 6px;
    white-space: normal;
    width: 60%;
    vertical-align: middle;
  }
  .stats-table td:last-child, .stats-table th:last-child{
    font-weight: 700;
    width: 1%;
    min-width: 90px;
    vertical-align: middle;
  }
  .stats-scroll{
    overflow: auto;
    border: 1px solid var(--paper-line);
    border-radius: 10px;
  }
  .stats-table{ border: none; }
  .stats-role-label{
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-soft);
    margin: 0 0 6px;
  }
  .stats-name{
    font-size: 15.5px;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 2px;
  }
  .date-line{
    margin-bottom: 4px;
  }
  .date-line:last-child{ margin-bottom: 0; }
  .date-chip{
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink);
    background: #EDDDB8;
    padding: 2px 8px;
    border-radius: 5px;
    margin: 0 4px 3px 0;
  }

  .empty-state{
    text-align: center;
    padding: 40px 16px;
    color: var(--ink-soft);
    font-size: 13.5px;
    border: 1px dashed var(--paper-line);
    border-radius: 10px;
  }

  .card{
    position: relative;
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    overflow: hidden;
  }
  .card.is-pending{ border-color: #EBC9A0; }
  .card.is-done{ opacity: 0.6; }

  .check-wrap{
    display: flex;
    align-items: center;
    padding-top: 2px;
  }
  .check-wrap input{
    width: 20px; height: 20px;
    accent-color: var(--stamp-green);
    cursor: pointer;
  }

  .card-body{ flex: 1; min-width: 0; }
  .card-top{
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 10px;
    margin-bottom: 4px;
  }
  .name{ font-size: 16px; font-weight: 700; }
  .meta-mono{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    background: #F5EAD3;
    padding: 2px 7px;
    border-radius: 5px;
  }
  .date-type{ font-size: 13.5px; color: var(--ink); }
  .note{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 4px;
    line-height: 1.5;
  }
  .import-tag{
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    margin-top: 8px;
  }

  .card-actions{
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stamp{
    font-family: 'Noto Serif TC', serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.15em;
    padding: 3px 9px;
    border: 2px solid var(--stamp-red);
    color: var(--stamp-red);
    border-radius: 5px;
    transform: rotate(-6deg);
    background: var(--stamp-red-bg);
  }
  .stamp.done{
    border-color: var(--stamp-green);
    color: var(--stamp-green);
    background: var(--stamp-green-bg);
    transform: rotate(-4deg);
  }

  .del-btn{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 16px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    border-radius: 6px;
  }
  .del-btn:hover{ background: #F5EAD3; color: var(--stamp-red); }

  footer{
    margin-top: 20px;
    text-align: center;
  }
  footer button{ font-weight: 500; }

  .lock-screen{
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .lock-box{
    background: var(--paper);
    border: 1px solid var(--paper-line);
    border-radius: 12px;
    padding: 28px 24px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }
  .lock-box h2{
    font-family: 'Noto Serif TC', serif;
    font-size: 18px;
    margin: 0 0 6px;
  }
  .lock-box p{
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 16px;
    line-height: 1.6;
  }
  .lock-box input[type="text"]{
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--paper-line);
    border-radius: 7px;
    font-size: 13px;
    margin-bottom: 14px;
  }
  .lock-msg{
    font-size: 12.5px;
    color: var(--stamp-red);
    min-height: 16px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .logout-link{
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .who-am-i{
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
    margin-bottom: 10px;
  }
  body.is-locked > *:not(.lock-screen){
    display: none;
  }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen" style="display:none;">
  <div class="lock-box">
    <h2>假單送審追蹤</h2>
    <p>請用 Google 帳號登入<br>只有被加進試算表「共用」名單的帳號才能成功讀取資料。</p>
    <button class="btn-primary" id="loginBtn" style="width:100%;">使用 Google 帳號登入</button>
    <div class="lock-msg" id="lockMsg"></div>
  </div>
</div>

<div style="background:#B5462B; color:#fff; text-align:center; padding:8px 16px; font-size:13px; font-weight:700;">
  這是示範版本，所有操作僅暫存在您的瀏覽器裡，不會影響任何真實資料，重新整理頁面會還原成範例資料。
</div>

<header>
  <h1>假單送審追蹤</h1>
  <p>匯入回報內容，自動抓出請假人員資料。假單尚未送審會有核取方塊，勾選「已送審」前視為待處理，避免遺漏。</p>
  <div class="parse-msg" id="apiStatusMsg" style="margin-top:8px;"></div>
</header>

<div class="panel">
  <h2>貼上回報內容</h2>
  <div class="upload-row">
    <label for="fileInput" class="file-label">上傳 HTML 檔案</label>
    <input type="file" id="fileInput" accept=".html,.htm,text/html" style="display:none">
    <span class="file-name" id="fileName">尚未選擇檔案</span>
  </div>
  <div class="divider-text">或直接貼上文字內容：</div>
  <textarea id="input" placeholder="例如：
D1A A0011 王小明 8/10請病假，假單後補，謝謝"></textarea>
  <div class="btn-row">
    <button class="btn-primary" id="parseBtn">確認匯入</button>
    <button class="btn-ghost" id="clearInputBtn">清除欄位</button>
  </div>
  <div class="parse-msg" id="parseMsg"></div>
</div>

<div class="view-tabs">
  <button class="tab-btn active" id="tabRecordsBtn">請假紀錄</button>
  <button class="tab-btn" id="tabStatsBtn">假別統計</button>
</div>

<div id="recordsView">

<div class="stats">
  <div class="stat pending">
    <div class="num" id="statPending">0</div>
    <div class="lbl">尚待送審</div>
  </div>
</div>

<div class="list-head">
  <h2 style="margin:0; font-size:14px;">請假紀錄</h2>
  <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
    <select id="monthFilter" style="padding:5px 8px; border:1px solid var(--paper-line); border-radius:7px; font-size:12.5px; color:var(--ink); background:var(--paper);">
      <option value="all">全部月份</option>
    </select>
    <button class="btn-ghost" id="logToggleBtn" style="display:none;">匯入紀錄</button>
    <button class="btn-ghost" id="refreshBtn" style="padding:5px 12px; font-size:12.5px;">重新整理</button>
    <label class="filter-toggle">
      <input type="checkbox" id="filterPending">
      只顯示尚待送審
    </label>
  </div>
</div>

<div class="panel" id="logPanel" style="display:none;">
  <h2>匯入紀錄</h2>
  <div style="overflow-x:auto;">
    <table style="width:100%; border-collapse:collapse; font-size:13px;">
      <thead>
        <tr style="text-align:left; color:var(--ink-soft); border-bottom:1px solid var(--paper-line);">
          <th style="padding:6px 8px;">日期</th>
          <th style="padding:6px 8px;">文字輸入</th>
          <th style="padding:6px 8px;">HTML 上傳</th>
          <th style="padding:6px 8px;">合計</th>
        </tr>
      </thead>
      <tbody id="logTableBody"></tbody>
    </table>
  </div>
  <div class="parse-msg" id="logMsg"></div>
</div>

<div class="two-col-wrap">
  <div class="col-section">
    <h3 class="col-title">客服 <span class="col-count" id="csCount">0</span></h3>
    <div id="listCS"></div>
  </div>
  <div class="col-section">
    <h3 class="col-title">幹部 <span class="col-count" id="cadreCount">0</span></h3>
    <div id="listCadre"></div>
  </div>
</div>

<div class="panel" id="unclassifiedSection" style="display:none; margin-top:16px;">
  <h2>未分類人員 <span class="col-count" id="unclassifiedCount">0</span></h2>
  <div id="listUnclassified"></div>
</div>

</div>

<div id="statsView" style="display:none;">
  <div class="list-head" style="margin-bottom:16px;">
    <h2 style="margin:0; font-size:14px;">假別統計</h2>
    <div class="month-multiselect" id="statsMonthFilterWrap">
      <button class="btn-ghost" id="statsMonthFilterBtn" type="button" style="padding:5px 12px; font-size:12.5px;">篩選月份：全部</button>
      <div class="month-dropdown" id="statsMonthDropdown">
        <div class="month-dropdown-grid">
          <label><input type="checkbox" class="stats-month-cb" value="1">1月</label>
          <label><input type="checkbox" class="stats-month-cb" value="2">2月</label>
          <label><input type="checkbox" class="stats-month-cb" value="3">3月</label>
          <label><input type="checkbox" class="stats-month-cb" value="4">4月</label>
          <label><input type="checkbox" class="stats-month-cb" value="5">5月</label>
          <label><input type="checkbox" class="stats-month-cb" value="6">6月</label>
          <label><input type="checkbox" class="stats-month-cb" value="7">7月</label>
          <label><input type="checkbox" class="stats-month-cb" value="8">8月</label>
          <label><input type="checkbox" class="stats-month-cb" value="9">9月</label>
          <label><input type="checkbox" class="stats-month-cb" value="10">10月</label>
          <label><input type="checkbox" class="stats-month-cb" value="11">11月</label>
          <label><input type="checkbox" class="stats-month-cb" value="12">12月</label>
        </div>
        <div class="month-dropdown-actions">
          <button type="button" id="statsMonthAllBtn" class="btn-ghost">全選</button>
          <button type="button" id="statsMonthClearBtn" class="btn-ghost">清除</button>
        </div>
      </div>
    </div>
  </div>
  <div id="statsContainer"></div>
</div>

<footer>
  <button class="btn-ghost" id="resetBtn">清空所有紀錄</button>
  <div style="margin-top:12px;">
    <button class="logout-link" id="logoutBtn">重置示範資料</button>
  </div>
</footer>

<script>
(function(){
  // 請貼上你在 Google Cloud Console 建立的 OAuth Client ID
  const GOOGLE_CLIENT_ID = '288761753627-7bm0mta5hcbdafo3om1fjbv6jsfh885k.apps.googleusercontent.com';
  // 請貼上固定要使用的 Google 試算表網址（登入後就是連到這一份，不用每次再貼）
  const FIXED_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1SOuwFtuY7YEQ0Z14KA20eNdNuS2TEFA_Bag8QPuRLvo/edit?usp=sharing';
  const SHEET_SCOPE = 'https://www.googleapis.com/auth/spreadsheets';
  const SHEET_TAB = 'Entries';
  const ROSTER_TAB = 'Roster';
  const KEYWORDS_TAB = 'Keywords';
  const LOG_TAB = 'ImportLog';
  const STATS_TYPES_TAB = 'StatsLeaveTypes';
  const HEADERS = ['id','className','empId','name','date','leaveType','note','keywordDetected','submitted','addedAt','importMethod'];

  const SHEET_URL_KEY = 'leaveTrackerSheetUrl';

  let entries = [];
  let filterPendingOnly = false;
  let selectedMonth = 'all';
  let statsSelectedMonths = new Set(); // 空集合代表「全部月份」
  let accessToken = '';
  let tokenClient = null;
  let rosterSet = new Set();
  let rosterRoleMap = new Map();
  let customSubmittedKeywords = [];
  let customPendingKeywords = [];
  let statsLeaveTypesList = [];

  const parseMsgEl = document.getElementById('parseMsg');
  const inputEl = document.getElementById('input');
  const apiStatusMsg = document.getElementById('apiStatusMsg');
  const lockScreen = document.getElementById('lockScreen');
  const lockMsg = document.getElementById('lockMsg');
  const loginBtn = document.getElementById('loginBtn');

  const PENDING_KEYWORDS = ['後補','尚未送審','未送審','未送假單','補假單','補件','沒送','未送出','假單未送'];
  const SUBMITTED_KEYWORDS = ['已送審','已送出假單','假單已送','已送假單','已送出','已完成送審'];

  // 關鍵字判斷只維護繁體版本，比對前把常見簡體字先轉回繁體，避免簡繁不同碼導致比對不到
  const SIMP_TO_TRAD = { '审':'審','单':'單','后':'後','请':'請','补':'補','没':'沒' };
  function normalizeForMatch(text){
    return (text || '').split('').map(ch => SIMP_TO_TRAD[ch] || ch).join('');
  }

  // ---------- 解析回報內容 ----------

  function stripHtmlToLines(raw){
    let s = raw.replace(/<\s*(br|\/tr|\/li|\/p|\/div|\/h[1-6])[^>]*>/gi, '\n');
    const doc = new DOMParser().parseFromString(s, 'text/html');
    const text = doc.body ? doc.body.textContent : s;
    return text.split('\n').map(l => l.trim()).filter(Boolean);
  }

  // 共用前綴：班別(可省略) 員編 姓名
  const PREFIX_RE = '(?:([A-Za-z][A-Za-z0-9]{0,3})[\\s　]+)?([A-Za-z]\\d{3,6})[\\s　]+([\\u4e00-\\u9fff]{2,4})[\\s　]+';

  // 各種句型規則：每一條負責從「姓名之後」的文字，抓出 date / leaveType / note
  const PARSE_RULES = [
    {
      // 情境一：8/10請病假，備註（日期跟「請」之間可以插入時間區間；同一張假單即使橫跨多個日期，也只記一筆）
      name: 'leave',
      regex: new RegExp(PREFIX_RE + '((?:\\d{1,2}\\/\\d{1,2}[、,，]?)+)[\\s　]*(\\d{1,2}:\\d{2}-\\d{1,2}:\\d{2})?[\\s　]*[請请]([\\u4e00-\\u9fff]{1,6}假)([^\\n]*)'),
      build: (m) => ({
        date: m[4].replace(/[、,，]$/, ''),
        leaveType: m[6],
        note: (m[5] ? m[5] + '，' : '') + (m[7] || '')
      })
    },
    {
      // 情境二：8/16新增特休一天，備註（同一張假單只記一筆）
      name: 'add',
      regex: new RegExp(PREFIX_RE + '((?:\\d{1,2}\\/\\d{1,2}[、,，]?)+)[\\s　]*新增([\\u4e00-\\u9fff]{2,4})(?:[一二兩三四五六七八九十\\d]+[天日])?([^\\n]*)'),
      build: (m) => ({
        date: m[4].replace(/[、,，]$/, ''),
        leaveType: m[5],
        note: m[6] || ''
      })
    },
    {
      // 情境三：原休8/31調休至8/29（備註），...（容忍「調休」「调修」等不同打法；
      // 支援一行裡出現多組「原休…至…」，每組各自產生一筆紀錄）
      name: 'swap',
      regex: new RegExp(PREFIX_RE + '((?=[\\s\\S]*原休)[^\\n]*)'),
      build: (m) => {
        const remainder = m[4] || '';
        const swapRe = /原休(\d{1,2}\/\d{1,2})[^\d\n]{1,4}至(\d{1,2}\/\d{1,2})([^\n]*?)(?=原休|$)/g;
        const records = [];
        let sm;
        while((sm = swapRe.exec(remainder)) !== null){
          records.push({
            date: sm[2],
            leaveType: '調休',
            note: `原休${sm[1]}調休至${sm[2]}${sm[3] || ''}`
          });
        }
        return records;
      }
    },
    {
      // 情境四：9/3 下班忘刷卡 備註（不算請假，是補刷卡申請單的追蹤；支援多日期）
      name: 'missedCard',
      regex: new RegExp(PREFIX_RE + '((?:\\d{1,2}\\/\\d{1,2}[、,，]?)+)[^\\n]*?忘.{0,3}[刷打]卡([^\\n]*)'),
      build: (m) => ({
        date: m[4].replace(/[、,，]$/, ''),
        leaveType: '忘刷卡',
        note: m[5] || ''
      })
    },
    {
      // 情境五（通用備援）：8/14 1542-1700 公出 備註 —— 沒有固定觸發字的假別，
      // 日期後面接（可省略的）時間區間，再接 2-4 個中文字當假別，其餘當備註。同一張假單只記一筆。
      // 因為沒有固定關鍵字，放在規則清單最後面，其他規則都對不到才會用這條。
      name: 'generic',
      regex: new RegExp(PREFIX_RE + '((?:\\d{1,2}\\/\\d{1,2}[、,，]?)+)[\\s　]*(\\d{1,2}:?\\d{2}-\\d{1,2}:?\\d{2})?[\\s　]*([\\u4e00-\\u9fff]{2,4})[\\s　]?([^\\n]*)'),
      build: (m) => ({
        date: m[4].replace(/[、,，]$/, ''),
        leaveType: m[6],
        note: (m[5] ? m[5] + '，' : '') + (m[7] || '')
      })
    }
  ];

  function normalizeEmpId(id){
    return (id || '').trim().toUpperCase();
  }

  function parseText(raw){
    if(!raw.trim()) return [];
    const lines = raw.includes('<') ? stripHtmlToLines(raw) : raw.split('\n').map(l=>l.trim()).filter(Boolean);
    const results = [];
    lines.forEach(line => {
      for(const rule of PARSE_RULES){
        const m = line.match(rule.regex);
        if(!m) continue;
        const className = m[1] || '';
        const empId = m[2];
        const name = m[3];
        if(rosterSet.size > 0 && !rosterSet.has(normalizeEmpId(empId))) return;
        const built = rule.build(m);
        const records = Array.isArray(built) ? built : [built];
        const allSubmittedKeywords = SUBMITTED_KEYWORDS.concat(customSubmittedKeywords);
        const allPendingKeywords = PENDING_KEYWORDS.concat(customPendingKeywords);
        records.forEach(({ date, leaveType, note: rawNote }) => {
          const note = (rawNote || '').replace(/^[，,、\s]+/, '').trim();
          const hasKeyword = allPendingKeywords.some(k => normalizeForMatch(note).includes(k) || normalizeForMatch(line).includes(k));
          const hasSubmittedKeyword = allSubmittedKeywords.some(k => normalizeForMatch(note).includes(k) || normalizeForMatch(line).includes(k));
          results.push({
            id: empId + '|' + date + '|' + leaveType,
            className, empId, name, date, leaveType,
            note, keywordDetected: hasKeyword, submittedKeywordDetected: hasSubmittedKeyword
          });
        });
        return; // 一行只要有一條規則對到就停止，不再嘗試其他規則
      }
    });
    return results;
  }

  function maskName(name){
    if(!name) return name;
    const chars = Array.from(name);
    if(chars.length <= 1) return chars.join('');
    if(chars.length === 2) return chars[0] + 'O';
    return chars[0] + 'O'.repeat(chars.length - 2) + chars[chars.length - 1];
  }

  function buildEntryObject(p, source){
    return {
      id: p.id,
      className: p.className,
      empId: p.empId,
      name: maskName(p.name),
      date: p.date,
      leaveType: p.leaveType,
      note: p.note,
      keywordDetected: p.keywordDetected,
      submitted: !!p.submittedKeywordDetected,
      addedAt: Date.now(),
      importMethod: source || 'text'
    };
  }

  function isAutoSubmitted(e){
    const text = normalizeForMatch(e.note || '');
    return SUBMITTED_KEYWORDS.concat(customSubmittedKeywords).some(k => text.includes(k));
  }

  function dateSortKey(d){
    const firstDate = (d || '').split(/[、,，]/)[0];
    const [mo, da] = firstDate.split('/').map(Number);
    return (mo || 0) * 100 + (da || 0);
  }

  function getEntryMonth(d){
    const firstDate = (d || '').split(/[、,，]/)[0];
    const mo = Number(firstDate.split('/')[0]);
    return mo || null;
  }

  // ---------- Google 試算表網址 / ID ----------

  function extractSpreadsheetId(input){
    if(!input) return '';
    const trimmed = input.trim();
    const m = trimmed.match(/\/d\/([a-zA-Z0-9-_]+)/);
    if(m) return m[1];
    if(/^[a-zA-Z0-9-_]+$/.test(trimmed)) return trimmed;
    return '';
  }

  function getSheetUrl(){
    return localStorage.getItem(SHEET_URL_KEY) || FIXED_SHEET_URL;
  }

  function setSheetUrl(url){
    localStorage.setItem(SHEET_URL_KEY, url);
  }

  function getSpreadsheetId(){
    return 'demo-mode';
  }

  function sheetsBase(){
    return 'https://sheets.googleapis.com/v4/spreadsheets/' + getSpreadsheetId() + '/values';
  }

  // ---------- Google Sheets API 呼叫 ----------

  async function apiFetch(url, options){
    options = options || {};
    const res = await fetch(url, {
      ...options,
      headers: {
        'Authorization': 'Bearer ' + accessToken,
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    });
    if(res.status === 401 || res.status === 403){
      const err = new Error('存取被拒絕，請確認這個 Google 帳號已被加入試算表的共用名單，或重新登入。');
      err.unauthorized = true;
      throw err;
    }
    if(!res.ok){
      const text = await res.text();
      throw new Error('試算表 API 錯誤（' + res.status + '）：' + text);
    }
    return res;
  }

  function normalizeBool(v){
    return v === true || v === 'true' || v === 'TRUE';
  }

  let demoRowCounter = 1000;

  async function fetchSheetRows(){
    return entries.map(e => ({
      rowNum: e._row,
      id: e.id,
      raw: HEADERS.map(h => e[h])
    }));
  }

  async function fetchRoster(){
    return { set: rosterSet, roleMap: rosterRoleMap };
  }

  async function fetchCustomKeywords(){
    return { submitted: customSubmittedKeywords, pending: customPendingKeywords };
  }

  async function logImport(method, count){
    // 示範版不需要記錄匯入紀錄
    return;
  }

  async function fetchImportLog(){
    return [];
  }

  function groupLogsByDate(logs){
    const sorted = [...logs].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
    const map = new Map();
    sorted.forEach(l => {
      const d = new Date(l.timestamp);
      const key = isNaN(d) ? String(l.timestamp) : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
      if(!map.has(key)) map.set(key, { text: 0, file: 0, total: 0 });
      const g = map.get(key);
      if(l.method === 'file') g.file += l.count; else g.text += l.count;
      g.total += l.count;
    });
    return map;
  }

  async function fetchStatsLeaveTypes(){
    return statsLeaveTypesList;
  }

  function rowToEntry(x){
    const obj = {};
    HEADERS.forEach((h, i) => { obj[h] = x.raw[i]; });
    obj.submitted = normalizeBool(obj.submitted);
    obj.keywordDetected = normalizeBool(obj.keywordDetected);
    obj._row = x.rowNum;
    return obj;
  }

  async function updateRow(rowNum, entryObj){
    const idx = entries.findIndex(e => e._row === rowNum);
    if(idx !== -1){
      entries[idx] = { ...entryObj, _row: rowNum };
    }
  }

  async function appendRow(entryObj){
    entries.push({ ...entryObj, _row: demoRowCounter++ });
  }

  async function updateSubmittedCell(rowNum, submitted){
    const e = entries.find(e => e._row === rowNum);
    if(e) e.submitted = submitted;
  }

  async function clearRow(rowNum){
    entries = entries.filter(e => e._row !== rowNum);
  }

  async function clearAllRows(){
    entries = [];
  }

  // ---------- 讀取與畫面 ----------

  async function refreshFromServer(){
    if(!getSpreadsheetId()){
      apiStatusMsg.textContent = '尚未設定 Google 試算表網址，請先完成上方設定。';
      return;
    }
    if(!accessToken){
      return;
    }
    try{
      const [rows, roster, keywords, statsTypes] = await Promise.all([fetchSheetRows(), fetchRoster(), fetchCustomKeywords(), fetchStatsLeaveTypes()]);
      statsLeaveTypesList = statsTypes;
      rosterSet = roster.set;
      rosterRoleMap = roster.roleMap;
      customSubmittedKeywords = keywords.submitted;
      customPendingKeywords = keywords.pending;
      let allEntries = rows.map(rowToEntry);
      if(rosterSet.size > 0){
        allEntries = allEntries.filter(e => rosterSet.has(normalizeEmpId(e.empId)));
      }
      entries = allEntries;
      apiStatusMsg.textContent = rosterSet.size > 0
        ? '已連線，共 ' + entries.length + ' 筆紀錄（已依早班名單篩選）。'
        : '已連線，共 ' + entries.length + ' 筆紀錄（尚未設定早班名單，目前顯示全部人員）。';
      hideLock();
      render();
    } catch(err){
      if(err.unauthorized){
        showLock(err.message);
      } else {
        apiStatusMsg.textContent = '連線失敗：' + err.message;
      }
      console.error(err);
    }
  }

  function updateMonthOptions(){
    const monthSelect = document.getElementById('monthFilter');
    const months = Array.from(new Set(entries.map(e => getEntryMonth(e.date)).filter(Boolean))).sort((a,b) => a - b);
    const prevValue = monthSelect.value || selectedMonth;
    monthSelect.innerHTML = '<option value="all">全部月份</option>';
    months.forEach(mo => {
      const opt = document.createElement('option');
      opt.value = String(mo);
      opt.textContent = mo + '月';
      monthSelect.appendChild(opt);
    });
    if(prevValue !== 'all' && months.includes(Number(prevValue))){
      monthSelect.value = prevValue;
      selectedMonth = prevValue;
    } else {
      monthSelect.value = 'all';
      selectedMonth = 'all';
    }
  }

  function buildCard(e){
    const autoSubmitted = isAutoSubmitted(e);
    const card = document.createElement('div');
    card.className = 'card ' + (e.submitted ? 'is-done' : 'is-pending');

    if(!autoSubmitted){
      const checkWrap = document.createElement('div');
      checkWrap.className = 'check-wrap';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = e.submitted;
      cb.setAttribute('aria-label', e.name + ' 已送審');
      cb.addEventListener('change', () => {
        e.submitted = cb.checked;
        render();
        updateSubmittedCell(e._row, e.submitted)
          .catch(err => { apiStatusMsg.textContent = '更新失敗：' + err.message; });
      });
      checkWrap.appendChild(cb);
      card.appendChild(checkWrap);
    }

    const body = document.createElement('div');
    body.className = 'card-body';

    const top = document.createElement('div');
    top.className = 'card-top';
    top.innerHTML = `
      <span class="name">${escapeHtml(e.name)}</span>
      ${e.className ? `<span class="meta-mono">${escapeHtml(e.className)}</span>` : ''}
      <span class="meta-mono">${escapeHtml(e.empId)}</span>
    `;
    body.appendChild(top);

    const dt = document.createElement('div');
    dt.className = 'date-type';
    dt.textContent = e.date + ' ・ 請' + e.leaveType;
    body.appendChild(dt);

    if(e.note){
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent = e.note;
      body.appendChild(note);
    }

    const importInfo = formatImportInfo(e);
    if(importInfo){
      const tag = document.createElement('div');
      tag.className = 'import-tag';
      tag.textContent = importInfo;
      body.appendChild(tag);
    }

    card.appendChild(body);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const stamp = document.createElement('div');
    stamp.className = 'stamp' + (e.submitted ? ' done' : '');
    stamp.textContent = e.submitted ? '已送審' : '待送審';
    actions.appendChild(stamp);

    const delBtn = document.createElement('button');
    delBtn.className = 'del-btn';
    delBtn.textContent = '✕';
    delBtn.title = '刪除此筆紀錄';
    delBtn.addEventListener('click', () => {
      const desc = `${e.name} ${e.date} ${e.leaveType}`;
      if(!confirm(`確定刪除「${desc}」這筆記錄？`)) return;
      entries = entries.filter(x => x.id !== e.id);
      render();
      clearRow(e._row)
        .catch(err => { apiStatusMsg.textContent = '刪除失敗：' + err.message; });
    });
    actions.appendChild(delBtn);

    card.appendChild(actions);
    return card;
  }

  function renderInto(containerEl, list, emptyText){
    containerEl.innerHTML = '';
    if(list.length === 0){
      const div = document.createElement('div');
      div.className = 'empty-state';
      div.textContent = emptyText;
      containerEl.appendChild(div);
      return;
    }
    list.forEach(e => containerEl.appendChild(buildCard(e)));
  }

  function getRole(empId){
    return rosterRoleMap.get(normalizeEmpId(empId)) || '';
  }

  function render(){
    updateMonthOptions();

    const pending = entries.filter(e => !e.submitted).length;
    document.getElementById('statPending').textContent = pending;

    const sorted = [...entries].sort((a,b) => {
      if(a.submitted !== b.submitted) return a.submitted ? 1 : -1;
      return dateSortKey(b.date) - dateSortKey(a.date);
    });

    let visible = filterPendingOnly ? sorted.filter(e => !e.submitted) : sorted;
    if(selectedMonth !== 'all'){
      visible = visible.filter(e => getEntryMonth(e.date) === Number(selectedMonth));
    }

    const csList = visible.filter(e => getRole(e.empId) === '客服');
    const cadreList = visible.filter(e => getRole(e.empId) === '幹部');
    const unclassifiedList = visible.filter(e => {
      const r = getRole(e.empId);
      return r !== '客服' && r !== '幹部';
    });

    const emptyText = entries.length === 0
      ? '尚無紀錄，請在上方貼上回報內容並解析。'
      : '目前沒有符合篩選條件的紀錄。';

    document.getElementById('csCount').textContent = csList.length;
    document.getElementById('cadreCount').textContent = cadreList.length;
    renderInto(document.getElementById('listCS'), csList, emptyText);
    renderInto(document.getElementById('listCadre'), cadreList, emptyText);

    const unclassifiedSection = document.getElementById('unclassifiedSection');
    if(unclassifiedList.length === 0){
      unclassifiedSection.style.display = 'none';
    } else {
      unclassifiedSection.style.display = 'block';
      document.getElementById('unclassifiedCount').textContent = unclassifiedList.length;
      renderInto(document.getElementById('listUnclassified'), unclassifiedList, emptyText);
    }

    renderStats();
  }

  function computeStatsRows(leaveType, role){
    const people = new Map();
    entries.forEach(e => {
      if(e.leaveType !== leaveType) return;
      if(getRole(e.empId) !== role) return;
      const mo = getEntryMonth(e.date);
      if(!mo) return;
      if(statsSelectedMonths.size > 0 && !statsSelectedMonths.has(mo)) return;
      const key = e.empId;
      if(!people.has(key)){
        people.set(key, { name: e.name, empId: e.empId, monthMap: new Map() });
      }
      const monthMap = people.get(key).monthMap;
      if(!monthMap.has(mo)) monthMap.set(mo, []);
      monthMap.get(mo).push(e.date);
    });
    return Array.from(people.values())
      .map(p => {
        const monthGroups = Array.from(p.monthMap.entries())
          .sort((a,b) => a[0] - b[0])
          .map(([, dates]) => [...dates].sort((a,b) => dateSortKey(a) - dateSortKey(b)));
        const total = monthGroups.reduce((sum, arr) => sum + arr.length, 0);
        return { name: p.name, empId: p.empId, monthGroups, total };
      })
      .sort((a,b) => b.total - a.total);
  }

  function buildStatsTable(roleLabel, rows){
    const wrap = document.createElement('div');
    if(rows.length === 0){
      wrap.className = 'empty-state';
      wrap.style.marginBottom = '12px';
      wrap.textContent = `${roleLabel}：目前沒有人請過這種假別。`;
      return wrap;
    }
    const scroll = document.createElement('div');
    scroll.className = 'stats-scroll';
    const table = document.createElement('table');
    table.className = 'stats-table';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headRow.innerHTML = `<th>人員/員編</th><th>已請假日期</th><th>累計次數</th>`;
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    rows.forEach(p => {
      const tr = document.createElement('tr');
      const nameCell = `<div class="stats-name">${escapeHtml(p.name)}</div><div><span class="meta-mono">${escapeHtml(p.empId)}</span></div>`;
      const dateCell = p.monthGroups.map(dates =>
        `<div class="date-line">${dates.map(d => `<span class="date-chip">${escapeHtml(d)}</span>`).join('')}</div>`
      ).join('');
      tr.innerHTML = `<td>${nameCell}</td>` +
        `<td style="text-align:left;">${dateCell}</td>` +
        `<td>${p.total}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    scroll.appendChild(table);
    wrap.appendChild(scroll);
    return wrap;
  }

  function renderStats(){
    const container = document.getElementById('statsContainer');
    container.innerHTML = '';

    if(statsLeaveTypesList.length === 0){
      const div = document.createElement('div');
      div.className = 'empty-state';
      div.textContent = '尚未設定要統計的假別，請到試算表的 StatsLeaveTypes 分頁新增假別名稱。';
      container.appendChild(div);
      return;
    }

    statsLeaveTypesList.forEach(leaveType => {
      const block = document.createElement('div');
      block.className = 'stats-table-wrap';

      const title = document.createElement('div');
      title.className = 'stats-table-title';
      title.textContent = leaveType + ' 統計';
      block.appendChild(title);

      const body = document.createElement('div');
      body.style.padding = '12px';

      const csRows = computeStatsRows(leaveType, '客服');
      const csLabel = document.createElement('div');
      csLabel.className = 'stats-role-label';
      csLabel.textContent = '客服';
      body.appendChild(csLabel);
      body.appendChild(buildStatsTable('客服', csRows));

      const cadreRows = computeStatsRows(leaveType, '幹部');
      const cadreLabel = document.createElement('div');
      cadreLabel.className = 'stats-role-label';
      cadreLabel.style.marginTop = '14px';
      cadreLabel.textContent = '幹部';
      body.appendChild(cadreLabel);
      body.appendChild(buildStatsTable('幹部', cadreRows));

      block.appendChild(body);
      container.appendChild(block);
    });
  }

  function formatImportInfo(e){
    const ts = Number(e.addedAt);
    if(!ts) return '';
    const d = new Date(ts);
    if(isNaN(d)) return '';
    const dateStr = (d.getMonth() + 1) + '/' + d.getDate();
    const methodStr = e.importMethod === 'file' ? 'HTML 上傳' : '文字輸入';
    return dateStr + ' 匯入・' + methodStr;
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({
      '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
    }[c]));
  }

  // ---------- 解析後寫入 ----------

  async function runParse(raw, source){
    source = source || 'text';
    if(!getSpreadsheetId()){
      parseMsgEl.textContent = '請先在上方「試算表設定」貼上網址並儲存。';
      return;
    }
    if(!accessToken){
      parseMsgEl.textContent = '請先登入 Google 帳號。';
      return;
    }
    const parsed = parseText(raw);
    if(parsed.length === 0){
      parseMsgEl.textContent = '沒有解析到符合格式的請假紀錄，請確認內容格式。';
      return;
    }
    parseMsgEl.textContent = '解析到 ' + parsed.length + ' 筆，送出中…';
    let successCount = 0, failCount = 0;
    try{
      const sheetRows = await fetchSheetRows();
      const idMap = new Map(sheetRows.map(x => [x.id, x]));
      for(const p of parsed){
        const entryObj = buildEntryObject(p, source);
        const existing = idMap.get(p.id);
        try{
          if(existing){
            const existingEntry = rowToEntry(existing);
            if(!p.submittedKeywordDetected){
              entryObj.submitted = existingEntry.submitted;
            }
            await updateRow(existing.rowNum, entryObj);
          } else {
            await appendRow(entryObj);
          }
          successCount++;
        } catch(err){
          failCount++;
        }
      }
    } catch(err){
      if(err.unauthorized){ showLock(err.message); return; }
      parseMsgEl.textContent = '連線失敗：' + err.message;
      return;
    }
    if(successCount > 0){
      logImport(source, successCount).catch(() => {});
      inputEl.value = '';
    }
    await refreshFromServer();
    parseMsgEl.textContent = failCount === 0
      ? `已送出 ${successCount} 筆紀錄。`
      : `送出 ${successCount} 筆成功，${failCount} 筆失敗，請稍後再試一次。`;
  }

  document.getElementById('parseBtn').addEventListener('click', () => {
    runParse(inputEl.value, 'text');
  });

  document.getElementById('fileInput').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if(!file) return;
    document.getElementById('fileName').textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      const content = String(reader.result || '');
      inputEl.value = content;
      runParse(content, 'file');
    };
    reader.onerror = () => {
      parseMsgEl.textContent = '檔案讀取失敗，請確認檔案格式是否為 HTML。';
    };
    reader.readAsText(file, 'UTF-8');
  });

  document.getElementById('clearInputBtn').addEventListener('click', () => {
    inputEl.value = '';
    parseMsgEl.textContent = '';
  });

  document.getElementById('filterPending').addEventListener('change', (ev) => {
    filterPendingOnly = ev.target.checked;
    render();
  });

  document.getElementById('monthFilter').addEventListener('change', (ev) => {
    selectedMonth = ev.target.value;
    render();
  });

  document.getElementById('refreshBtn').addEventListener('click', () => {
    refreshFromServer();
  });

  document.getElementById('logToggleBtn').addEventListener('click', async () => {
    const panel = document.getElementById('logPanel');
    const logMsg = document.getElementById('logMsg');
    if(panel.style.display !== 'none'){
      panel.style.display = 'none';
      return;
    }
    if(!accessToken || !getSpreadsheetId()){
      logMsg.textContent = '請先登入後再查看匯入紀錄。';
      panel.style.display = 'block';
      return;
    }
    panel.style.display = 'block';
    logMsg.textContent = '讀取中…';
    try{
      const logs = await fetchImportLog();
      const grouped = groupLogsByDate(logs);
      const tbody = document.getElementById('logTableBody');
      tbody.innerHTML = '';
      if(grouped.size === 0){
        logMsg.textContent = '目前還沒有任何匯入紀錄。';
      } else {
        logMsg.textContent = '';
        grouped.forEach((g, dateKey) => {
          const tr = document.createElement('tr');
          tr.style.borderBottom = '1px solid var(--paper-line)';
          tr.innerHTML = `
            <td style="padding:6px 8px;">${escapeHtml(dateKey)}</td>
            <td style="padding:6px 8px;">${g.text}</td>
            <td style="padding:6px 8px;">${g.file}</td>
            <td style="padding:6px 8px; font-weight:700;">${g.total}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    } catch(err){
      logMsg.textContent = '讀取失敗：' + err.message;
    }
  });

  document.getElementById('resetBtn').addEventListener('click', async () => {
    if(!getSpreadsheetId()){
      parseMsgEl.textContent = '請先設定 Google 試算表網址。';
      return;
    }
    if(!confirm('確定要清空所有已儲存的請假紀錄嗎？此動作無法復原，且會影響所有使用者。')) return;
    try{
      await clearAllRows();
      await refreshFromServer();
    } catch(err){
      apiStatusMsg.textContent = '清空失敗：' + err.message;
    }
  });

  // ---------- 鎖定畫面 / Google 登入 ----------

  function showLock(msg){
    document.body.classList.add('is-locked');
    lockScreen.style.display = 'flex';
    lockMsg.textContent = msg || '';
  }

  function hideLock(){
    document.body.classList.remove('is-locked');
    lockScreen.style.display = 'none';
  }

  function waitForGoogleReady(cb, tries){
    tries = tries || 0;
    if(window.google && google.accounts && google.accounts.oauth2){
      cb();
    } else if(tries < 50){
      setTimeout(() => waitForGoogleReady(cb, tries + 1), 200);
    } else {
      lockMsg.textContent = 'Google 登入元件載入失敗，請重新整理頁面再試一次。';
    }
  }

  function initGoogleClient(){
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: SHEET_SCOPE,
      callback: (resp) => {
        loginBtn.disabled = false;
        if(resp.error){
          lockMsg.textContent = '登入失敗：' + resp.error + '（請確認這個帳號是否已加入測試使用者名單）';
          return;
        }
        accessToken = resp.access_token;
        lockMsg.textContent = '登入成功，讀取中…';
        refreshFromServer();
      }
    });
  }

  loginBtn.addEventListener('click', () => {
    if(!getSpreadsheetId()){
      lockMsg.textContent = '尚未設定試算表網址，請聯絡工具管理者。';
      return;
    }
    if(!tokenClient){
      lockMsg.textContent = 'Google 登入元件尚未就緒，請稍候再試。';
      return;
    }
    loginBtn.disabled = true;
    lockMsg.textContent = '';
    tokenClient.requestAccessToken({ prompt: '' });
  });

  document.getElementById('tabRecordsBtn').addEventListener('click', () => {
    document.getElementById('tabRecordsBtn').classList.add('active');
    document.getElementById('tabStatsBtn').classList.remove('active');

  document.getElementById('tabStatsBtn').addEventListener('click', () => {
    document.getElementById('tabStatsBtn').classList.add('active');
    document.getElementById('tabRecordsBtn').classList.remove('active');
    document.getElementById('statsView').style.display = 'block';

  function updateStatsMonthBtnLabel(){
    const btn = document.getElementById('statsMonthFilterBtn');
    if(statsSelectedMonths.size === 0){
      btn.textContent = '篩選月份：全部';
    } else {
      const months = Array.from(statsSelectedMonths).sort((a,b) => a - b);
      btn.textContent = '篩選月份：' + months.join('、') + '月';
    }
  }

  document.getElementById('statsMonthFilterBtn').addEventListener('click', (ev) => {
    ev.stopPropagation();
    document.getElementById('statsMonthDropdown').classList.toggle('open');
  });

  document.querySelectorAll('.stats-month-cb').forEach(cb => {
    cb.addEventListener('change', () => {
      const mo = Number(cb.value);
      if(cb.checked) statsSelectedMonths.add(mo);
      else statsSelectedMonths.delete(mo);
      updateStatsMonthBtnLabel();
      renderStats();
    });
  });

  document.getElementById('statsMonthAllBtn').addEventListener('click', () => {
    document.querySelectorAll('.stats-month-cb').forEach(cb => {
      cb.checked = true;
      statsSelectedMonths.add(Number(cb.value));
    });
    updateStatsMonthBtnLabel();
    renderStats();
  });

  document.getElementById('statsMonthClearBtn').addEventListener('click', () => {
    document.querySelectorAll('.stats-month-cb').forEach(cb => { cb.checked = false; });
    statsSelectedMonths.clear();
    updateStatsMonthBtnLabel();
    renderStats();
  });

  document.addEventListener('click', (ev) => {
    const wrap = document.getElementById('statsMonthFilterWrap');
    if(wrap && !wrap.contains(ev.target)){
      document.getElementById('statsMonthDropdown').classList.remove('open');

  });
